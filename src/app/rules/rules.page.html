<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      {{device.name}} ({{device.id}})
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-list *ngFor="let dev of rules">

  <ion-card color="light">
    <ion-card-header>
      <ion-item color="light">
          <ion-label color="dark">
          <h1>Daily shit</h1>
        </ion-label>
          <ion-toggle style="float: right;" slot="end"></ion-toggle>
      </ion-item>
    </ion-card-header>

    <ion-card-content>
      <ion-row>
        <ion-text style="color: #383a3e" align-self-center>
          <h1>Please </h1>
        </ion-text>
        <ion-button size="small" color="success" class="actioinButton">Turn on</ion-button>

        <ion-text style="color: #383a3e" align-self-center>
          <h1> on </h1>
        </ion-text>

        <ion-button size="small" color="medium" class="actioinButton">$time</ion-button>

        <ion-text style="color: #383a3e" align-self-center>
          <h1> and </h1>
        </ion-text>

        <ion-button size="small" color="danger" class="actioinButton"> turn off</ion-button>

        <ion-text color="dark" align-self-center>
          <h1> on </h1>
        </ion-text>

        <ion-button size="small" color="medium" class="actioinButton">$time</ion-button>

        <ion-text color="dark" align-self-center>
          <h1> every </h1>
        </ion-text>

        <ion-button size="small" color="medium" class="actioinButton">$day</ion-button>
      </ion-row>
    </ion-card-content>
  </ion-card>


</ion-list>
<ion-content>
</ion-content>
