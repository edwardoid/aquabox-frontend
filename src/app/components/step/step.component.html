<ion-card id="card{{dev.id}}" class="relay-card" color="light"  *ngIf="dev.deviceClass == 'relay'">
  <ion-card-header>
      <ion-item>
          <ion-thumbnail slot="start">
              <img src="{{dev.image()}}" class="bg-white">
          </ion-thumbnail>
          <ion-col>
              <ion-card-title>{{dev.name}}</ion-card-title>
              <ion-card-subtitle>{{tr.deviceType(dev.type)}}</ion-card-subtitle>
          </ion-col>
          <ion-toggle (click)="toggleDeviceIfRulesAreDisabled(dev)" [(ngModel)]="dev.isOn" slot="end">
          </ion-toggle>
      </ion-item>
  </ion-card-header>

  <ion-card-content>
      <ion-icon name="power" slot="icon-only" color="{{dev.isOn ? 'success' : 'danger'}}" size="large">
      </ion-icon>
      <ion-button class="rules-settings" fill="clear" style="float: right;" (click)='openRules(dev);'>
          <ion-icon name="alarm" slot="icon-only"></ion-icon>
      </ion-button>

      <ion-button class="device-settings" fill="clear" style="float: right;" (click)="setupDevice(dev)">
          <ion-icon name="cog" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button *ngIf="!dev.rulesEnabled" (click)="enableRulesOn(dev)" class="device_icon" fill="outline" style="float: right;" size="small">
          Enable rules
      </ion-button>
  </ion-card-content>
</ion-card>
