<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>
            Devices
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-refresher slot="fixed" (ionRefresh)="getDevices($event)">
        <ion-refresher-content pullingIcon="arrow-dropdown" pullingText="Pull to refresh" refreshingSpinner="circles" refreshingText="Refreshing...">
        </ion-refresher-content>
    </ion-refresher>

    <ion-card color="light">
        <ion-card-header>
            <ion-card-title>
                <h1>Sensors</h1>
            </ion-card-title>
        </ion-card-header>
        <ion-card-content>
            <div *ngFor="let dev of this?.devices">
                <ion-row id="sensor{{dev.id}}" color="light" *ngIf="dev.deviceClass == 'sensor'">
                    <ion-item-divider color="light">
                        <ion-thumbnail slot="start">
                            <img src="{{dev.image()}}">
                        </ion-thumbnail>
                        <ion-text>
                            <h1>{{dev.name}}: {{dev.round(1)}}°C</h1>
                        </ion-text>
                        <ion-button class="device_icon" fill="clear" style="float: right;" slot="end" (click)="setupDevice(dev)">
                            <ion-icon name="create" slot="icon-only"></ion-icon>
                        </ion-button>
                    </ion-item-divider>
                </ion-row>
            </div>
        </ion-card-content>
    </ion-card>
    <ion-list *ngFor="let dev of this?.devices">
        <ion-card id="card{{dev.id}}" color="light" *ngIf="dev.deviceClass == 'relay'">
            <ion-card-header>
                <ion-item color="light">
                    <ion-thumbnail slot="start">
                        <img src="{{dev.image()}}">
                    </ion-thumbnail>
                    <ion-col>
                        <ion-card-title>{{dev.name}}</ion-card-title>
                        <ion-card-subtitle>{{tr.deviceType(dev.type)}}</ion-card-subtitle>
                    </ion-col>
                    <ion-toggle (click)="toggleDeviceIfRulesAreDisabled(dev)" [(ngModel)]="dev.isOn" slot="end">
                    </ion-toggle>
                </ion-item>
            </ion-card-header>

            <ion-card-content>
                <ion-icon name="power" slot="icon-only" color="{{dev.isOn ? 'success' : 'danger'}}" size="large">
                </ion-icon>
                <ion-button class="device_icon" fill="clear" style="float: right;" color="danger" (click)='openRules(dev);'>
                    <ion-icon name="clock" slot="icon-only"></ion-icon>
                </ion-button>

                <ion-button class="device_icon" fill="clear" style="float: right;" (click)="setupDevice(dev)">
                    <ion-icon name="create" slot="icon-only"></ion-icon>
                </ion-button>
                <ion-button *ngIf="!dev.rulesEnabled" (click)="enableRulesOn(dev)" class="device_icon" fill="outline" style="float: right;"
                    size="small">
                    Enable rules
                </ion-button>
            </ion-card-content>
        </ion-card>
    </ion-list>

</ion-content>
