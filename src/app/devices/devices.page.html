<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>
            Devices
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content *ngIf="devices != undefined">
    <ion-refresher slot="fixed" (ionRefresh)="getDevices($event)">
        <ion-refresher-content pullingIcon="arrow-dropdown" pullingText="Pull to refresh" refreshingSpinner="circles"
            refreshingText="Refreshing...">
        </ion-refresher-content>
    </ion-refresher>

        <ion-item>
        <ion-label>
            Available devices
        </ion-label>
    </ion-item>
        <ion-list *ngFor="let dev of devices.valuesArray()">

            <ion-card color="light">
                <ion-card-header>
                    <ion-item color="light">
                        <ion-thumbnail slot="start">
                            <img src="{{dev.image()}}">
                        </ion-thumbnail>
                        <ion-label>{{dev.name}}
                            <p>{{dev.type}}</p>
                        </ion-label>
                        <ion-button>
                            Disable rules
                        </ion-button>
                        <ion-toggle on (click)="toggleDevice(dev, $event)">
                            Turn on/off
                        </ion-toggle>
                    </ion-item>
                </ion-card-header>

                <ion-card-content>
                    <ion-icon name="power" slot="icon-only" color="{{dev.isOn ? 'success' : 'danger'}}" size="large"></ion-icon>
                    <ion-button  class="device_icon" fill="clear" style="float: right;" color="danger" (click)='openRules(dev);'  size="large">
                        <ion-icon name="clock" slot="icon-only"></ion-icon>
                    </ion-button>

                    <ion-button  class="device_icon" fill="clear" style="float: right;"  size="large">
                        <ion-icon name="create" slot="icon-only"></ion-icon>
                    </ion-button>
                </ion-card-content>
            </ion-card>
        </ion-list>

</ion-content>
