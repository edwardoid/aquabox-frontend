<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>
            Devices
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-refresher slot="fixed" (ionRefresh)="getDevices($event)">
        <ion-refresher-content pullingIcon="arrow-dropdown" pullingText="Pull to refresh" refreshingSpinner="circles"
            refreshingText="Refreshing...">
        </ion-refresher-content>
    </ion-refresher>

    <ion-item>
        <ion-label>
            Available devices
        </ion-label>
    </ion-item>
    <ion-list *ngFor="let dev of this?.devices">
        <ion-card id="card{{dev.id}}" color="light">
            <ion-card-header>
                <ion-item color="light">
                    <ion-thumbnail slot="start">
                        <img src="{{dev.image()}}">
                    </ion-thumbnail>
                    <ion-label>{{dev.name}}
                        <p>{{dev.type}}</p>
                    </ion-label>
                    <ion-button fill="clear">
                        <ion-icon src="/assets/icon/rules_off.svg" slot="icon-only" color="success" size="large">
                        </ion-icon>
                    </ion-button>
                    <ion-toggle on (click)="toggleDeviceIfRulesAreDisabled(dev)" [(ngModel)]="dev.isOn">
                    </ion-toggle>
                </ion-item>
            </ion-card-header>

            <ion-card-content>
                <ion-icon name="power" slot="icon-only" color="{{dev.isOn ? 'success' : 'danger'}}" size="large">
                </ion-icon>
                <ion-button class="device_icon" fill="clear" style="float: right;" color="danger" (click)='openRules(dev);'>
                    <ion-icon name="clock" slot="icon-only"></ion-icon>
                </ion-button>

                <ion-button class="device_icon" fill="clear" style="float: right;" (click)="setupDevice(dev)" >
                    <ion-icon name="create" slot="icon-only"></ion-icon>
                </ion-button>
                <ion-button *ngIf="!dev.rulesEnabled"  (click)="enableRulesOn(dev)"   class="device_icon" fill="outline" style="float: right;" size="small">
                    Enable rules
                </ion-button>
            </ion-card-content>
        </ion-card>
    </ion-list>

</ion-content>
